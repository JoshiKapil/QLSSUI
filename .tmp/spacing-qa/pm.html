.fixture-host .workspace[class*=feature-theme--] .workspace__sidenav a.active i {
  color: #fff;
}
.fixture-host .workspace[class*=feature-theme--] .workspace__sidenav a:hover {
  background: var(--primary-soft);
}

/* ── Nav arrow & Rail Footer (Image 2) ── */
.workspace__sidenav a {
  display: flex;
  align-items: center;
  gap: 10px;
}
.workspace__sidenav a .nav-arrow {
  margin-left: auto;
  font-size: 9px;
  color: var(--shell-muted);
  opacity: 0.45;
  transition: transform 0.16s ease, opacity 0.16s ease;
}
.workspace__sidenav a:hover .nav-arrow {
  opacity: 0.9;
  transform: translateX(2px);
}
.workspace__sidenav a.active .nav-arrow {
  opacity: 0.95;
  color: #ffffff;
}

.workspace__rail {
  display: flex;
  flex-direction: column;
}

.workspace__rail-footer {
  margin-top: auto;
  padding-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.rail-quote-block {
  padding: 0 4px;
}
.rail-quote-block .rail-quote-text {
  margin: 0;
  font-family: var(--font-heading, "Playfair Display", serif);
  font-style: italic;
  font-size: 11.5px;
  color: rgba(255, 255, 255, 0.72);
  letter-spacing: 0.02em;
  line-height: 1.4;
}
.rail-quote-block .rail-quote-line {
  display: block;
  width: 32px;
  height: 2px;
  background: #CBA56B;
  margin-top: 6px;
  border-radius: 999px;
}

.rail-brand-graphic {
  padding: 12px 10px;
  border-radius: 12px;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.08);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
}
.rail-brand-graphic .brand-graphic-box {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rail-brand-graphic .brand-graphic-box .brand-symbol-svg {
  width: 70px;
  height: 40px;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.4));
}
.rail-brand-graphic .brand-graphic-box .brand-label {
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1.5px;
  color: #ffffff;
  margin-top: 2px;
  background: rgba(181, 121, 74, 0.3);
  border: 1px solid rgba(203, 165, 107, 0.4);
  padding: 2px 7px;
  border-radius: 4px;
}
.rail-brand-graphic .rail-motto {
  font-size: 8px;
  font-weight: 850;
  letter-spacing: 1.5px;
  color: rgba(255, 255, 255, 0.58);
  text-transform: uppercase;
}

/* ── Precision Heritage Theme Overrides for PM Shell ── */
.theme-heritage .fixture-host .workspace__rail {
  background: #1C2023 !important;
  border-right: 1px solid rgba(221, 214, 202, 0.15) !important;
}
.theme-heritage .fixture-host .workspace__nav-label {
  color: #707E7A !important;
}
.theme-heritage .fixture-host .workspace__sidenav a {
  color: #DDD6CA !important;
}
.theme-heritage .fixture-host .workspace__sidenav a i {
  color: #CBA56B !important;
}
.theme-heritage .fixture-host .workspace__sidenav a:hover {
  background: rgba(181, 121, 74, 0.15) !important;
  color: #ffffff !important;
}
.theme-heritage .fixture-host .workspace__sidenav a.active {
  background: #B5794A !important;
  color: #ffffff !important;
  box-shadow: 0 4px 14px rgba(181, 121, 74, 0.35) !important;
}
.theme-heritage .fixture-host .workspace__sidenav a.active i {
  color: #ffffff !important;
}
.theme-heritage .fixture-host .workspace__sidenav a.active .nav-arrow {
  color: #ffffff !important;
}
.theme-heritage .fixture-host .workspace__sidenav a.active::before {
  display: none;
}
.theme-heritage .fixture-host .workspace-logo img {
  filter: brightness(1.05);
}.fixture-host {
  display: block;
  color: var(--text-dark, #0a1c2f);
  color: var(--text-primary, var(--text-dark, #0a1c2f));
  --pm-primary: var(--primary, #2f7ce8);
  --pm-secondary: var(--secondary, #13a8a3);
  --pm-ink: #0b1f34;
  --pm-muted: #64758a;
  --pm-border: #dbe7f3;
  --pm-surface: #fff;
  --pm-soft: #f4f8fd;
  --pm-teal: #0f9f9a;
  --pm-danger: #c83a46;
  --pm-warn: #b86c08;
  --pm-success: #13805d;
  --pm-ink: var(--text-primary, #0b1f34);
  --pm-muted: var(--text-muted, #64758a);
  --pm-border: var(--border, #dbe7f3);
  --pm-surface: var(--surface, #fff);
  --pm-soft: var(--surface-soft, #f4f8fd);
  --pm-teal: var(--accent, #0f9f9a);
  --pm-danger: var(--danger, #c83a46);
  --pm-warn: var(--warning, #b86c08);
  --pm-success: var(--success, #13805d);
}

* {
  box-sizing: border-box;
}

.pm-page {
  position: relative;
  min-height: calc(100vh - 74px);
  padding: 26px clamp(16px, 2.4vw, 34px) 42px;
  background: radial-gradient(circle at 88% 0, rgba(15, 159, 154, 0.09), transparent 28%), radial-gradient(circle at 20% 0, rgba(47, 124, 232, 0.08), transparent 34%), linear-gradient(180deg, #f8fbff 0%, #f4f8fd 100%);
}

.pm-page:before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: linear-gradient(rgba(30, 79, 128, 0.022) 1px, transparent 1px), linear-gradient(90deg, rgba(30, 79, 128, 0.022) 1px, transparent 1px);
  background-size: 30px 30px;
  mask-image: linear-gradient(to bottom, #000, transparent 42%);
}

.pm-page > * {
  position: relative;
}

.pm-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 22px;
  padding: 22px 24px;
  overflow: hidden;
  border: 1px solid rgba(255, 255, 255, 0.22);
  border-radius: 22px;
  background: linear-gradient(125deg, var(--primary-dark, #0b3b92) 0%, var(--pm-primary) 52%, var(--pm-secondary) 118%);
  box-shadow: 0 18px 42px rgba(15, 55, 100, 0.17);
}

.pm-head:before,
.pm-head:after {
  content: "";
  position: absolute;
  border-radius: 50%;
  pointer-events: none;
}

.pm-head:before {
  width: 210px;
  height: 210px;
  right: -78px;
  top: -135px;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.24), transparent 68%);
}

.pm-head:after {
  width: 160px;
  height: 160px;
  left: 38%;
  bottom: -126px;
  background: radial-gradient(circle, rgba(120, 246, 232, 0.23), transparent 70%);
}

.pm-head > div {
  position: relative;
  z-index: 1;
}

.pm-head__eyebrow {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 7px;
  color: #bff9f3;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}

.pm-head__eyebrow:before {
  content: "";
  width: 20px;
  height: 3px;
  border-radius: 999px;
  background: linear-gradient(90deg, #fff, #7ff0e5);
}

.pm-head h1 {
  margin: 0;
  color: #fff;
  font-size: clamp(25px, 3vw, 36px);
  font-weight: 850;
  letter-spacing: -1px;
  line-height: 1.08;
  text-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

.pm-head p {
  max-width: 760px;
  margin: 8px 0 0;
  color: rgba(255, 255, 255, 0.78);
  font-size: 13px;
  line-height: 1.55;
}

.pm-head .pm-btn--ghost {
  color: #fff;
  background: rgba(255, 255, 255, 0.12);
  border-color: rgba(255, 255, 255, 0.28);
  box-shadow: none;
  backdrop-filter: blur(7px);
}

.pm-head .pm-btn--soft {
  color: #eafffc;
  background: rgba(15, 47, 73, 0.22);
  border-color: rgba(184, 250, 242, 0.28);
}

.pm-head .pm-btn--primary {
  color: #145076;
  background: #fff;
  box-shadow: 0 10px 24px rgba(3, 36, 69, 0.18);
}

.pm-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 9px;
}

.pm-btn {
  min-height: 39px;
  border: 1px solid transparent;
  border-radius: 11px;
  padding: 9px 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 800;
  line-height: 1;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
}

.pm-btn:hover:not(:disabled) {
  transform: translateY(-1px);
}

.pm-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.pm-btn--primary {
  color: #fff;
  background: linear-gradient(135deg, var(--pm-primary), #356ed8 58%, var(--pm-teal));
  box-shadow: 0 9px 22px rgba(42, 105, 192, 0.22);
}

.pm-btn--primary:hover:not(:disabled) {
  box-shadow: 0 12px 27px rgba(42, 105, 192, 0.29);
}

.pm-btn--ghost {
  color: #225d96;
  background: rgba(255, 255, 255, 0.92);
  border-color: #cbddec;
  box-shadow: 0 3px 10px rgba(20, 62, 105, 0.05);
}

.pm-btn--soft {
  color: #087d78;
  background: #eaf8f6;
  border-color: #c5ece8;
}

.pm-btn--danger {
  color: #b42335;
  background: #fff1f2;
  border-color: #ffd1d5;
}

.pm-btn--sm {
  min-height: 32px;
  padding: 7px 10px;
  border-radius: 9px;
  font-size: 11px;
}

.pm-grid {
  display: grid;
  grid-template-columns: repeat(12, minmax(0, 1fr));
  gap: 16px;
}

.pm-card {
  grid-column: span 12;
  position: relative;
  padding: 19px;
  background: rgba(255, 255, 255, 0.94);
  border: 1px solid rgba(40, 91, 145, 0.12);
  border-radius: 18px;
  box-shadow: 0 10px 30px rgba(18, 62, 106, 0.065);
  backdrop-filter: blur(8px);
}

.pm-card:before {
  content: "";
  position: absolute;
  left: 16px;
  right: 16px;
  top: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(61, 144, 224, 0.24), rgba(15, 159, 154, 0.22), transparent);
}

.pm-card h2,
.pm-card h3 {
  margin-top: 0;
  color: var(--pm-ink);
}

.pm-card h2 {
  font-size: 19px;
}

.pm-card h3 {
  font-size: 15px;
}

.pm-section-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 14px;
}

.pm-section-head h2,
.pm-section-head h3 {
  margin: 0;
}

.pm-section-head p {
  margin: 4px 0 0;
  color: var(--pm-muted);
  font-size: 12px;
}

.pm-section-head__meta {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--pm-muted);
  font-size: 11px;
  font-weight: 700;
}

.pm-kpis {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.pm-kpi {
  position: relative;
  min-height: 112px;
  padding: 15px 16px;
  overflow: hidden;
  border-radius: 16px;
  background: linear-gradient(145deg, #fff, #f5f9ff);
  border: 1px solid #d9e7f5;
  box-shadow: 0 6px 17px rgba(20, 68, 116, 0.045);
}

.pm-kpi:after {
  content: "";
  position: absolute;
  width: 78px;
  height: 78px;
  border-radius: 50%;
  right: -29px;
  top: -31px;
  background: radial-gradient(circle, rgba(47, 124, 232, 0.12), transparent 68%);
}

.pm-kpi--teal:after {
  background: radial-gradient(circle, rgba(15, 159, 154, 0.16), transparent 68%);
}

.pm-kpi--warn:after {
  background: radial-gradient(circle, rgba(229, 151, 38, 0.17), transparent 68%);
}

.pm-kpi--danger:after {
  background: radial-gradient(circle, rgba(200, 58, 70, 0.14), transparent 68%);
}

.pm-kpi span {
  display: block;
  max-width: 125px;
  color: #5f7084;
  font-size: 10px;
  font-weight: 850;
  line-height: 1.35;
  letter-spacing: 0.65px;
  text-transform: uppercase;
}

.pm-kpi strong {
  display: block;
  margin-top: 10px;
  color: #091b2e;
  font-size: 27px;
  line-height: 1;
  font-weight: 900;
}

.pm-kpi small {
  display: block;
  margin-top: 7px;
  color: #8391a2;
  font-size: 10px;
}

.pm-table-wrap {
  width: 100%;
  overflow: auto;
  border: 1px solid #dfebf5;
  border-radius: 14px;
  background: #fff;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
}

.pm-table {
  width: 100%;
  min-width: 780px;
  border-collapse: collapse;
  background: #fff;
}

.pm-table th {
  position: sticky;
  top: 0;
  z-index: 2;
  text-align: left;
  padding: 11px 12px;
  color: #52677d;
  background: rgba(244, 248, 252, 0.98);
  backdrop-filter: blur(7px);
  border-bottom: 1px solid #dce8f3;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  white-space: nowrap;
}

.pm-table td {
  padding: 12px;
  border-bottom: 1px solid #edf2f7;
  color: #21364b;
  font-size: 12px;
  vertical-align: top;
}

.pm-table tbody tr {
  transition: 0.16s ease;
}

.pm-table tbody tr:hover {
  background: #f9fcff;
}

.pm-table tr:last-child td {
  border-bottom: 0;
}

.pm-table strong {
  color: #102b45;
}

.pm-table small {
  color: #76869a;
  line-height: 1.4;
}

.pm-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  min-height: 25px;
  padding: 4px 9px;
  border-radius: 999px;
  background: #eaf3ff;
  color: #2369b1;
  border: 1px solid #d2e5fb;
  font-size: 10px;
  font-weight: 850;
  white-space: nowrap;
}

.pm-badge:before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
}

.pm-badge--danger {
  background: #fff1f2;
  color: #b52d3d;
  border-color: #ffd8dc;
}

.pm-badge--ok {
  background: #ecf9f3;
  color: #147b58;
  border-color: #ccebdc;
}

.pm-badge--warn {
  background: #fff8e9;
  color: #a86408;
  border-color: #f5e2b7;
}

.pm-badge--neutral {
  background: #f2f5f8;
  color: #657487;
  border-color: #e2e8ef;
}

.pm-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 13px;
}

.pm-field {
  display: flex;
  min-width: 0;
  flex-direction: column;
  gap: 6px;
}

.pm-field--full {
  grid-column: 1/-1;
}

.pm-field--third {
  grid-column: span 1;
}

.pm-field label {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  color: #38516b;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: 0.35px;
  text-transform: uppercase;
}

.pm-field label small {
  color: #8c98a7;
  text-transform: none;
  letter-spacing: 0;
  font-weight: 600;
}

.pm-field input,
.pm-field select,
.pm-field textarea {
  width: 100%;
  min-height: 41px;
  border: 1px solid #cdddeb;
  border-radius: 11px;
  padding: 9px 11px;
  background: #fbfdff;
  color: #132a42;
  font: inherit;
  font-size: 12px;
  outline: none;
  transition: 0.16s ease;
}

.pm-field textarea {
  min-height: 96px;
  resize: vertical;
  line-height: 1.5;
}

.pm-field input:hover,
.pm-field select:hover,
.pm-field textarea:hover {
  border-color: #aec8df;
}

.pm-field input:focus,
.pm-field select:focus,
.pm-field textarea:focus {
  border-color: var(--pm-primary);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(47, 124, 232, 0.1);
}

.pm-field input:disabled,
.pm-field select:disabled,
.pm-field textarea:disabled {
  background: #f1f5f8;
  color: #718095;
  cursor: not-allowed;
}

.pm-filterbar {
  display: flex;
  align-items: center;
  gap: 9px;
  flex-wrap: wrap;
  padding: 10px 12px;
  margin-bottom: 13px;
  border: 1px solid #dce8f3;
  border-radius: 13px;
  background: rgba(255, 255, 255, 0.78);
}

.pm-filterbar input,
.pm-filterbar select {
  height: 36px;
  min-width: 150px;
  border: 1px solid #ceddea;
  border-radius: 9px;
  padding: 7px 10px;
  background: #fff;
  color: #24405b;
  font-size: 11px;
  outline: none;
}

.pm-filterbar__grow {
  flex: 1;
  min-width: 220px !important;
}

.pm-panel {
  margin-bottom: 16px;
  border: 1px solid #d8e6f2;
  border-radius: 17px;
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 14px 34px rgba(12, 53, 95, 0.08);
  overflow: hidden;
}

.pm-panel__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 15px 17px;
  border-bottom: 1px solid #e6eef6;
  background: linear-gradient(120deg, #f7faff, #f3fbfa);
}

.pm-panel__head h2,
.pm-panel__head h3 {
  margin: 0;
}

.pm-panel__body {
  padding: 17px;
}

.pm-panel__foot {
  display: flex;
  justify-content: flex-end;
  gap: 9px;
  padding: 12px 17px;
  border-top: 1px solid #e7eef5;
  background: #fbfdff;
}

.pm-tabs {
  display: flex;
  gap: 6px;
  overflow: auto;
  padding: 4px;
  border: 1px solid #dce8f3;
  border-radius: 12px;
  background: #f5f9fc;
}

.pm-tab {
  border: 0;
  border-radius: 9px;
  padding: 8px 12px;
  background: transparent;
  color: #63778e;
  font-size: 11px;
  font-weight: 800;
  white-space: nowrap;
  cursor: pointer;
}

.pm-tab.active {
  background: #fff;
  color: #196b9e;
  box-shadow: 0 3px 12px rgba(20, 72, 116, 0.1);
}

.pm-chip-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.pm-check-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 8px 10px;
  border: 1px solid #d8e5f0;
  border-radius: 10px;
  background: #fbfdff;
  color: #334f69;
  font-size: 11px;
  cursor: pointer;
}

.pm-check-chip:has(input:checked) {
  border-color: #8fd5cf;
  background: #eefaf8;
  color: #087d78;
}

.pm-check-chip input {
  width: auto;
  margin: 0;
  accent-color: var(--pm-teal);
}

.pm-check-chip small {
  color: #8290a0;
}

.pm-upload {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 11px;
  border: 1px dashed #aac7dc;
  border-radius: 12px;
  background: #f8fbfe;
}

.pm-upload input[type=file] {
  max-width: 100%;
  font-size: 11px;
}

.pm-file-list {
  display: grid;
  gap: 7px;
  margin-top: 9px;
}

.pm-file {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 10px;
  border: 1px solid #e0e9f2;
  border-radius: 10px;
  background: #fff;
  font-size: 11px;
}

.pm-file strong {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.pm-file small {
  color: #7f8d9e;
}

.pm-file button {
  flex: 0 0 auto;
}

.pm-empty {
  padding: 34px 18px;
  text-align: center;
  color: #718196;
  font-size: 12px;
}

.pm-error,
.pm-note,
.pm-success {
  margin: 0 0 14px;
  padding: 11px 13px;
  border-radius: 11px;
  font-size: 12px;
  border: 1px solid;
}

.pm-error {
  background: #fff2f3;
  color: #aa2938;
  border-color: #ffd7dc;
}

.pm-note {
  background: #eef7ff;
  color: #245f96;
  border-color: #d4e8f8;
}

.pm-success {
  background: #edf9f4;
  color: #117758;
  border-color: #d2ecdf;
}

.pm-progress {
  height: 7px;
  background: #e6edf4;
  border-radius: 999px;
  overflow: hidden;
}

.pm-progress i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, var(--pm-primary), #34a5c8, var(--pm-teal));
  border-radius: inherit;
  box-shadow: 0 0 10px rgba(15, 159, 154, 0.25);
}

.pm-stat-row {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 9px;
}

.pm-stat {
  padding: 11px 12px;
  border: 1px solid #e0eaf3;
  border-radius: 12px;
  background: #f9fbfd;
}

.pm-stat small,
.pm-stat strong {
  display: block;
}

.pm-stat small {
  color: #7a8a9d;
  font-size: 9px;
  font-weight: 800;
  text-transform: uppercase;
}

.pm-stat strong {
  margin-top: 5px;
  color: #16334e;
  font-size: 13px;
}

.pm-split {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.75fr);
  gap: 16px;
}

.pm-sticky {
  position: sticky;
  top: 14px;
  align-self: start;
}

.pm-divider {
  height: 1px;
  margin: 15px 0;
  background: #e6edf4;
}

.pm-subtle {
  color: #718198;
  font-size: 11px;
  line-height: 1.5;
}

.pm-link {
  border: 0;
  background: transparent;
  padding: 0;
  color: var(--pm-primary);
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
}

.pm-card {
  transition: box-shadow 0.2s ease, border-color 0.2s ease;
}

.pm-card:hover {
  border-color: rgba(47, 124, 232, 0.18);
  box-shadow: 0 14px 38px rgba(18, 62, 106, 0.085);
}

.pm-table-wrap,
.pm-tabs {
  scrollbar-width: thin;
  scrollbar-color: #b8cfe1 transparent;
}

.pm-table-wrap::-webkit-scrollbar,
.pm-tabs::-webkit-scrollbar {
  height: 7px;
  width: 7px;
}

.pm-table-wrap::-webkit-scrollbar-thumb,
.pm-tabs::-webkit-scrollbar-thumb {
  background: #b8cfe1;
  border-radius: 999px;
}

.pm-table-wrap::-webkit-scrollbar-track,
.pm-tabs::-webkit-scrollbar-track {
  background: transparent;
}

@media (max-width: 1200px) {
  .pm-kpis {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .pm-split {
    grid-template-columns: 1fr;
  }
  .pm-sticky {
    position: static;

  }
  .pm-panel__foot {

  .pm-panel__foot .pm-btn {

}

.pm-tabs {
  max-width: 100%;
  overflow-x: auto;
  overscroll-behavior-inline: contain;
  scrollbar-width: thin;

  flex: 0 0 auto;
  min-height: 38px;
  font-size: max(11px, 0.6875rem);
}

.pm-field input,
.pm-field select,

/* Resolve module roles from the active application theme. */
body[data-theme] .fixture-host {
  --pm-primary: var(--primary);
  --pm-secondary: var(--secondary);
  --pm-ink: var(--text-primary);
  --pm-muted: var(--text-muted);
  --pm-border: var(--border);
  --pm-surface: var(--surface);
  --pm-soft: var(--surface-soft);
  --pm-teal: var(--accent);
  --pm-danger: var(--danger);
  --pm-warn: var(--warning);
  --pm-success: var(--success);
}

body[data-theme] .fixture-host .pm-page {
  background: var(--app-bg);
}
body[data-theme] .fixture-host .pm-card, body[data-theme] .fixture-host .pm-panel, body[data-theme] .fixture-host .pm-stat {
  background: var(--surface);
  border-color: var(--border);
}
body[data-theme] .fixture-host .pm-progress {
  height: 6px;
  background: var(--surface-soft);
}
body[data-theme] .fixture-host .pm-progress i {
  background: linear-gradient(90deg, var(--primary), var(--secondary));
}
body[data-theme] .fixture-host .pm-field input, body[data-theme] .fixture-host .pm-field select, body[data-theme] .fixture-host .pm-field textarea {
  background: var(--input-bg);
  border-color: var(--input-border);
  color: var(--text-primary);
}

.project-browser {
  margin-bottom: 16px;
}

.browser-count {
  margin-left: auto;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 800;
}

.project-cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
}

.project-card {
  min-width: 0;
  padding: 14px;
  text-align: left;
  border: 1px solid var(--surface-soft);
  border-radius: 15px;
  background: linear-gradient(145deg, #fff, var(--surface));
  cursor: pointer;
  transition: 0.2s ease;
}

.project-card:hover {
  transform: translateY(-2px);
  border-color: var(--border);
  box-shadow: 0 11px 24px color-mix(in srgb, var(--text-primary) 9%, transparent);
}

.project-card--active {
  border-color: var(--primary);
  background: linear-gradient(145deg, #f4fffd, var(--surface));
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 8%, transparent);
}

.project-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 7px;
}

.project-card__head > span:first-child {
  color: var(--primary);
  font-size: 10px;
  font-weight: 900;
}

.project-card > strong {
  display: block;
  margin-top: 12px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-primary);
  font-size: 14px;
}

.project-card > small {
  display: block;
  margin-top: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--text-muted);
  font-size: 10px;
}

.project-card__progress {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-top: 15px;
}

.project-card__progress .pm-progress {
  flex: 1;
}

.project-card__progress b {
  color: var(--primary);
  font-size: 11px;
}

.project-card__foot {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  margin-top: 10px;
  color: var(--text-muted);
  font-size: 9px;
}

.project-card__foot span {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.project-card__foot i {
  margin-right: 4px;
  color: var(--primary);
}

.project-hero {
  display: grid;
  grid-template-columns: minmax(220px, 1.2fr) 118px minmax(360px, 1.7fr) auto;
  align-items: center;
  gap: 20px;
  margin-bottom: 13px;
  padding: 18px 20px;
  border: 1px solid color-mix(in srgb, var(--primary) 14%, transparent);
  border-radius: 19px;
  background: linear-gradient(115deg, var(--text-primary) 0%, var(--text-primary) 48%, var(--primary) 100%);
  color: #fff;
  box-shadow: 0 16px 36px color-mix(in srgb, var(--text-primary) 16%, transparent);
  overflow: hidden;
  position: relative;
}

.project-hero:after {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  border-radius: 50%;
  right: -130px;
  top: -150px;
  background: radial-gradient(circle, color-mix(in srgb, var(--primary) 20%, transparent), transparent 70%);
}

.project-hero__identity,
.project-hero__ring,
.project-hero__metrics,
.project-hero > .pm-badge {
  position: relative;
  z-index: 1;
}

.project-hero__identity small {
  display: block;
  color: var(--border);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 1px;
  text-transform: uppercase;
}

.project-hero__identity h2 {
  margin: 4px 0 6px;
  font-size: 22px;
}

.project-hero__identity strong,
.project-hero__identity span {
  display: block;
}

.project-hero__identity strong {

}

.project-hero__identity span {

.project-hero__ring {

.project-hero__ring:before {

.project-hero__ring div {

  text-align: center;
}

.project-hero__ring strong,
.project-hero__ring small {

}

.project-hero__ring strong {
  font-size: 20px;
}

.project-hero__ring small {
  font-size: 9px;
  color: var(--border);
}

.project-hero__metrics {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px 15px;
}

.project-hero__metrics div {
  padding: 7px 9px;
  border-left: 2px solid color-mix(in srgb, var(--primary) 40%, transparent);
}

.project-hero__metrics span,
.project-hero__metrics strong {
  display: block;
}

.project-hero__metrics span {
  color: rgba(255, 255, 255, 0.55);
  font-size: 8px;
  font-weight: 850;
  text-transform: uppercase;
}

.project-hero__metrics strong {
  margin-top: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 11px;
}

.project-hero > .pm-badge {
  background: rgba(255, 255, 255, 0.13);
  border-color: rgba(255, 255, 255, 0.16);
  color: #fff;
}

.project-tabs {
  margin-bottom: 13px;
}

.project-tabs b {
  margin-left: 4px;
  padding: 1px 5px;
  border-radius: 999px;
  background: var(--surface-soft);
  font-size: 9px;
}

.project-overview .project-master {
  grid-column: span 8;
}

.project-overview .team-panel {
  grid-column: span 4;
}

.master-save {
  justify-content: flex-end;
  margin-top: 14px;
}

.team-panel__icon {
  color: var(--primary);
  font-size: 21px;
}

.team-current {
  margin-bottom: 14px;
  padding: 12px;
  border: 1px solid var(--surface-soft);
  border-radius: 13px;
  background: var(--surface);
}

.team-leader span,
.team-leader strong {
  display: block;
}

.team-leader span {
  color: var(--text-muted);
  font-size: 9px;
  font-weight: 850;
  text-transform: uppercase;
}

.team-leader strong {
  margin-top: 4px;
  color: var(--text-primary);
  font-size: 13px;
}

.team-members {
  display: grid;
  gap: 6px;
  margin-top: 10px;
}

.team-members > span {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  align-items: center;
  gap: 8px;
}

.team-members i {
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 8px;
  background: linear-gradient(145deg, var(--surface-soft), var(--surface));
  color: var(--primary);
  font-style: normal;
  font-size: 10px;
  font-weight: 900;
}

.team-members b {
  font-size: 10px;
  color: var(--text-muted);
}

.team-members small {
  font-size: 9px;
  color: var(--text-muted);
}

.team-members p {
  margin: 0;
  color: var(--text-muted);
  font-size: 10px;
}

.team-selector {
  margin-top: 11px;
}

.team-save {
  width: 100%;
  margin-top: 12px;
}

.activities-panel {
  margin-bottom: 16px;
}

.activity-editor {
  margin-bottom: 15px;
  padding: 15px;
  border: 1px solid var(--surface-soft);
  border-radius: 15px;
  background: linear-gradient(145deg, var(--surface), var(--surface));
}

.activity-editor__title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.activity-editor__title strong {
  color: var(--text-primary);
  font-size: 13px;
}

.timeline-list {
  display: grid;
  gap: 8px;
}

.timeline-row {
  display: grid;
  grid-template-columns: 38px minmax(240px, 1fr) 180px auto auto;
  align-items: center;
  gap: 12px;
  padding: 11px 12px;
  border: 1px solid var(--surface-soft);
  border-radius: 13px;
  background: #fff;
  transition: 0.17s ease;
}

.timeline-row:hover {
  border-color: var(--surface-soft);
  box-shadow: 0 6px 16px color-mix(in srgb, var(--text-primary) 6%, transparent);
}

.timeline-row--late {
  border-left: 4px solid #d44e58;
  background: #fffafb;
}

.timeline-row--done {
  border-left: 4px solid #27a27b;
  background: #fbfffd;
}

.timeline-row__seq {
  width: 31px;
  height: 31px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--surface);
  color: var(--primary);
  font-size: 10px;
  font-weight: 900;
}

.timeline-row__main strong,
.timeline-row__main span,
.timeline-row__main p,
.timeline-row__main small {
  display: block;
}

.timeline-row__main strong {
  color: var(--text-primary);
  font-size: 11px;
}

.timeline-row__main span {
  margin-top: 2px;
  color: var(--primary);
  font-size: 9px;
  font-weight: 750;
}

.timeline-row__main p {
  margin: 4px 0 0;
  color: var(--text-muted);
  font-size: 10px;
}

.timeline-row__main small {
  margin-top: 3px;
  color: #8d7380;
  font-size: 9px;
}

.timeline-row__dates {
  display: grid;
  gap: 4px;
}

.timeline-row__dates span {
  color: var(--text-muted);
  font-size: 8px;
  text-transform: uppercase;
}

.timeline-row__dates b {
  display: block;
  margin-top: 1px;
  color: var(--text-muted);
  font-size: 9px;
}

.document-drop {
  justify-content: space-between;
}

.document-drop > i {
  font-size: 25px;
  color: var(--primary);
}

.document-drop div {
  flex: 1;
}

.document-drop strong,
.document-drop small {
  display: block;
}

.document-drop strong {
  font-size: 12px;
  color: var(--text-muted);
}

.document-drop small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 9px;
}

.document-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 9px;
  margin-top: 13px;
}

.document-card {
  display: grid;
  grid-template-columns: 34px minmax(0, 1fr) 18px;
  align-items: center;
  gap: 9px;
  padding: 11px;
  text-align: left;
  border: 1px solid var(--surface-soft);
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
}

.document-card > i:first-child {
  width: 33px;
  height: 33px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: var(--surface);
  color: var(--primary);
}

.document-card > i:last-child {
  color: var(--text-muted);
}

.document-card strong,
.document-card span,
.document-card small {
  display: block;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.document-card strong {
  font-size: 10px;
  color: var(--text-muted);
}

.document-card span,
.document-card small {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 8px;
}

.closure-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
}

.closure-flow {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 14px 0 17px;
  overflow: auto;
}

.closure-flow span {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid var(--surface-soft);
  border-radius: 999px;
  background: #f7f9fb;
  color: var(--text-muted);
  font-size: 8px;
  font-weight: 850;
}

.closure-flow span.done {
  background: #eaf9f4;
  border-color: #c9eadc;
  color: #137859;
}

.closure-flow i {
  flex: 1;
  min-width: 12px;
  height: 1px;
  background: var(--surface-soft);
}

.closure-actions {
  margin-top: 12px;
}

.ack-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.signed-upload {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  padding: 11px;
  border: 1px dashed var(--border);
  border-radius: 11px;
  background: #f9fbfd;
}

.signed-upload strong,
.signed-upload span {
  display: block;
}

.signed-upload strong {
  font-size: 10px;
  color: var(--text-muted);
}

.signed-upload span {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 9px;
}

.signed-upload input {
  max-width: 230px;
  font-size: 9px;
}

.final-close {
  width: 100%;
  margin-top: 12px;
}

.integration-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.integration-grid article {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 10px;
  border: 1px solid var(--surface-soft);
  border-radius: 11px;
  background: #fff;
}

.integration-grid article > i {
  margin-top: 2px;
  color: var(--primary);
}

.integration-grid span,
.integration-grid strong,
.integration-grid small {
  display: block;
}

.integration-grid span {
  font-size: 8px;
  color: var(--text-muted);
  text-transform: uppercase;
  font-weight: 900;
}

.integration-grid strong {
  margin-top: 2px;
  color: var(--text-muted);
  font-size: 10px;
}

.integration-grid small {
  margin-top: 3px;
  color: var(--text-muted);
  font-size: 8px;
}

.link-editor {
  display: grid;
  grid-template-columns: 150px 140px 1fr 1fr auto;
  gap: 8px;
  margin-top: 13px;
  padding-top: 13px;
  border-top: 1px solid var(--surface-soft);
}

.link-editor input,
.link-editor select {
  min-width: 0;
  height: 38px;
  border: 1px solid var(--surface-soft);
  border-radius: 9px;
  padding: 7px 9px;
  background: #fff;
  font-size: 10px;
}

@media (max-width: 1280px) {
  .project-cards {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .project-hero {
    grid-template-columns: minmax(220px, 1fr) 105px minmax(320px, 1.4fr) auto;
  }
  .project-overview .project-master {
    grid-column: span 7;
  }
  .project-overview .team-panel {
    grid-column: span 5;
  }
  .timeline-row {
    grid-template-columns: 36px minmax(200px, 1fr) 150px auto;
  }
  .timeline-row > .pm-actions {

  }
  .link-editor {
    grid-template-columns: 130px 120px 1fr 1fr;
  }

    grid-column: 1/-1;
    justify-self: end;
  }

@media (max-width: 1000px) {
  .project-cards {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .project-hero {
    grid-template-columns: 1fr 100px auto;
  }
  .project-hero__metrics {
    grid-column: 1/-1;
    grid-row: 2;
  }
  .project-overview .project-master,
.project-overview .team-panel {
    grid-column: span 12;
  }
  .closure-grid {
    grid-template-columns: 1fr;
  }
  .document-grid,
.integration-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 700px) {
  .project-cards {
    grid-template-columns: 1fr;
  }
  .project-hero {
    grid-template-columns: minmax(0, 1fr) 88px;
    gap: 12px;
    padding: 14px;
  }
  .project-hero > .pm-badge {
    grid-column: 1/-1;
    justify-self: start;
  }
  .project-hero__metrics {
    grid-template-columns: 1fr 1fr;
  }
  .project-hero__ring {
    width: 84px;
    height: 84px;
  }
  .project-hero__ring:before {
    width: 64px;
    height: 64px;
  }
  .project-hero__ring strong {
    font-size: 16px;
  }
  .timeline-row {
    grid-template-columns: 34px minmax(0, 1fr) auto;
  }
  .timeline-row__dates {
    grid-column: 2/-1;
    grid-template-columns: 1fr 1fr;
  }
  .timeline-row > .pm-actions {
    grid-column: 2/-1;
    justify-content: flex-start;
  }
  .document-grid,
.integration-grid {
    grid-template-columns: 1fr;
  }
  .link-editor {
    grid-template-columns: 1fr;
  }
  .link-editor > .pm-btn {
    grid-column: auto;
    width: 100%;
  }
  .signed-upload {
    align-items: stretch;
    flex-direction: column;
  }
  .signed-upload input {
    max-width: 100%;
  }
  .browser-count {
    width: 100%;
    margin: 0;
    text-align: right;
  }
}
@media (max-width: 430px) {
  .project-hero__metrics {
    grid-template-columns: 1fr;
  }
  .project-card__foot {
    flex-direction: column;
  }
  .closure-flow {
    padding-bottom: 4px;
  }
}
/* PM_SPLIT_WATERGLASS_V1
   Compact two-pane PM workspace. Scoped to this PM component only. */
.pm-page {
  --pm-primary: var(--primary);
  --pm-secondary: var(--primary);
  --pm-teal: var(--primary);
  --pm-ink: var(--text-primary);
  --pm-muted: var(--text-muted);
  --pm-border: color-mix(in srgb, var(--primary) 22%, transparent);
  --pm-soft: color-mix(in srgb, var(--surface) 78%, transparent);
  padding: 14px clamp(10px, 1.4vw, 20px) 24px;
  background: radial-gradient(circle at 8% 2%, color-mix(in srgb, var(--primary) 19%, transparent), transparent 25%), radial-gradient(circle at 94% 2%, color-mix(in srgb, var(--primary) 14%, transparent), transparent 27%), linear-gradient(155deg, var(--surface) 0%, var(--surface) 52%, var(--surface) 100%);
}

.pm-page .pm-head {
  margin-bottom: 12px;
  padding: 14px 17px;
  border-radius: 18px;
  border: 1px solid rgba(255, 255, 255, 0.62);
  background: radial-gradient(circle at 90% -40%, rgba(255, 255, 255, 0.58), transparent 38%), linear-gradient(125deg, color-mix(in srgb, var(--primary) 94%, transparent), color-mix(in srgb, var(--primary) 92%, transparent) 52%, color-mix(in srgb, var(--primary) 90%, transparent));
  box-shadow: 0 12px 30px color-mix(in srgb, var(--primary) 15%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.34);
  backdrop-filter: blur(16px) saturate(125%);
}

.pm-page .pm-head h1 {
  font-size: clamp(21px, 2.25vw, 29px);
  letter-spacing: -0.55px;
}

.pm-page .pm-head p {
  max-width: 860px;
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.42;
}

.pm-page .pm-head__eyebrow {
  margin-bottom: 4px;
  font-size: 8px;
  letter-spacing: 1.25px;
}

.pm-split-workspace {
  display: grid;
  grid-template-columns: minmax(270px, 310px) minmax(0, 1fr);
  gap: 12px;
  align-items: start;
  margin: 0 !important;
}

.pm-list-pane {
  position: sticky;
  top: 10px;
  min-width: 0;
  align-self: start;
}

.pm-detail-pane {
  min-width: 0;
  display: grid;
  gap: 10px;
}

.pm-detail-pane > section,
.pm-detail-pane > ng-container > section {
  margin: 0 !important;
}

.pm-list-pane .pm-card {
  padding: 11px;
  border-radius: 16px;
  border: 1px solid color-mix(in srgb, var(--primary) 22%, transparent);
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.94), color-mix(in srgb, var(--surface) 80%, transparent));
  box-shadow: 0 12px 30px color-mix(in srgb, var(--primary) 9%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.92);
  backdrop-filter: blur(18px) saturate(130%);
}

.pm-list-pane .pm-card:before {
  left: 12px;
  right: 12px;
  background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--primary) 42%, transparent), color-mix(in srgb, var(--primary) 32%, transparent), transparent);
}

.pm-list-pane__title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 9px;
  margin-bottom: 9px;
  padding: 2px 2px 0;
}

.pm-list-pane__title small,
.pm-list-pane__title strong {
  display: block;
}

.pm-list-pane__title small {
  color: var(--text-muted);
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 1px;
}

.pm-list-pane__title strong {
  margin-top: 2px;
  color: var(--text-primary);
  font-size: 14px;
}

.pm-list-pane__title > span {
  min-width: 46px;
  padding: 5px 8px;
  border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.72);
  color: var(--primary);
  text-align: center;
  font-size: 9px;
  font-weight: 900;
  box-shadow: inset 0 1px 0 #fff;
}

.pm-filterbar--stacked {
  display: grid !important;
  grid-template-columns: 1fr !important;
  gap: 7px !important;
  margin-bottom: 9px !important;
  padding: 8px !important;
  border-color: color-mix(in srgb, var(--primary) 19%, transparent) !important;
  background: rgba(255, 255, 255, 0.58) !important;
  box-shadow: none !important;
}

.pm-filterbar--stacked input,
.pm-filterbar--stacked select {
  width: 100%;
  min-width: 0 !important;
  height: 34px;
  border-color: color-mix(in srgb, var(--primary) 24%, transparent);
  background: rgba(255, 255, 255, 0.86);
}

.pm-select-placeholder {
  min-height: 320px;
  display: grid;
  place-items: center;
  align-content: center;
  text-align: center;
  border: 1px dashed color-mix(in srgb, var(--primary) 34%, transparent) !important;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.88), color-mix(in srgb, var(--surface-soft) 68%, transparent)) !important;
  box-shadow: 0 12px 30px color-mix(in srgb, var(--primary) 7%, transparent) !important;
}

.pm-select-placeholder__drop {
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  margin-bottom: 10px;
  border-radius: 20px 20px 24px 24px;
  background: linear-gradient(145deg, var(--surface-soft), var(--surface));
  color: var(--primary);
  font-size: 24px;
  box-shadow: inset 0 1px 0 #fff, 0 9px 20px color-mix(in srgb, var(--primary) 12%, transparent);
}

.pm-select-placeholder h2 {
  margin: 0;
  color: var(--text-primary);
  font-size: 17px;
}

.pm-select-placeholder p {
  max-width: 480px;
  margin: 6px auto 0;
  color: var(--text-muted);
  font-size: 11px;
  line-height: 1.5;
}

@media (max-width: 1100px) {
  .pm-split-workspace {
    grid-template-columns: 1fr;
  }
  .pm-list-pane {
    position: static;
  }
  .pm-list-pane .project-cards,
.pm-list-pane .quote-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    max-height: 360px;
  }
}
@media (max-width: 680px) {
  .pm-page {
    padding: 9px 8px 18px;
  }
  .pm-page .pm-head {
    padding: 12px 13px;
    margin-bottom: 9px;
    border-radius: 15px;
  }
  .pm-page .pm-head p {
    display: none;
  }
  .pm-split-workspace {
    gap: 9px;
  }
  .pm-list-pane .project-cards,
.pm-list-pane .quote-grid {
    grid-template-columns: 1fr !important;
    max-height: 320px;
  }
  .pm-select-placeholder {
    min-height: 210px;
  }
}
.project-browser {

.project-cards {

  scrollbar-color: color-mix(in srgb, var(--primary) 35%, transparent) transparent;
}

.project-card {
  padding: 10px 11px;
  border-color: color-mix(in srgb, var(--primary) 19%, transparent);
  border-radius: 12px;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.86), color-mix(in srgb, var(--surface) 78%, transparent));
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9);
}

.project-card:hover {

  box-shadow: 0 7px 18px color-mix(in srgb, var(--primary) 10%, transparent);
}

.project-card--active {
