<section class="page">
  <header class="page-header">
    <p class="eyebrow">Assessment administration</p>
    <h1>Training Test Mappings</h1>
    <span>View Pre and Post Test assignments for every training.</span>
  </header>

  <div *ngIf="loading" class="state" role="status"><i class="fas fa-spinner fa-spin"></i> Loading training mappings…</div>
  <div *ngIf="error" class="state error" role="alert">{{ error }}</div>

  <div *ngIf="!loading && !error" class="table">
    <table>
      <thead><tr><th>Training Name</th><th>Pre Test</th><th>Post Test</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let row of rows">
          <td data-label="Training Name"><b>{{ label(row.training) }}</b></td>
          <td data-label="Pre Test" [class.unassigned]="row.pre === 'Not assigned'">{{ row.pre }}</td>
          <td data-label="Post Test" [class.unassigned]="row.post === 'Not assigned'">{{ row.post }}</td>
          <td data-label="Actions" class="actions">
            <button type="button" (click)="assign(row.training, 'pre')"><i class="fas fa-clipboard-list" aria-hidden="true"></i><span>Assign Pre Test</span></button>
            <button type="button" class="post" (click)="assign(row.training, 'post')"><i class="fas fa-clipboard-check" aria-hidden="true"></i><span>Assign Post Test</span></button>
          </td>
        </tr>
        <tr *ngIf="!rows.length"><td colspan="4" class="empty">No trainings available.</td></tr>
      </tbody>
    </table>
  </div>
</section>
