<section class="auth-section">
  <div class="container auth-shell">
    <div class="auth-panel">
      <div class="auth-panel__header">
        <span class="auth-eyebrow">New Account</span>
        <h1>Register</h1>
        <p>Create your QLSS user profile.</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="auth-grid">
          <label class="form-field">
            Name
            <input type="text" formControlName="name" />
            <small>{{ firstError(form.get('name'), 'Name') }}</small>
          </label>

          <label class="form-field">
            Email
            <input type="email" formControlName="email" />
            <small>{{ firstError(form.get('email'), 'Email') }}</small>
          </label>

          <label class="form-field">
            PasswordHash
            <input type="password" formControlName="passwordHash" />
            <small>{{ firstError(form.get('passwordHash'), 'PasswordHash') }}</small>
          </label>

          <label class="form-field">
            Confirm Password
            <input type="password" formControlName="confirmPassword" />
            <small *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">Passwords must match.</small>
          </label>

          <label class="form-field">
            Phone
            <input type="tel" formControlName="phone" />
            <small>{{ firstError(form.get('phone'), 'Phone') }}</small>
          </label>

          <label class="form-field">
            Role
            <select formControlName="role">
              <option value="User">User</option>
              <option value="Admin">Admin</option>
            </select>
            <small>{{ firstError(form.get('role'), 'Role') }}</small>
          </label>
        </div>

        <label class="form-field">
          Address
          <textarea rows="3" formControlName="address"></textarea>
          <small>{{ firstError(form.get('address'), 'Address') }}</small>
        </label>

        <div *ngIf="errorMessage" class="form-error">{{ errorMessage }}</div>

        <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Creating...' : 'Register' }}
        </button>

        <div class="auth-links">
          <a routerLink="/login">Already have an account?</a>
        </div>
      </form>
    </div>
  </div>
</section>
