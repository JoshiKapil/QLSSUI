<section class="auth-section">
  <div class="container auth-shell">
    <div class="auth-panel">
      <div class="auth-panel__header">
        <span class="auth-eyebrow">Reset Access</span>
        <h1>Reset Password</h1>
        <p>Set a new password using your reset token.</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-field">
          Reset Token
          <input type="text" formControlName="token" />
        </label>

        <div class="auth-grid">
          <label class="form-field">
            New Password
            <input type="password" formControlName="newPassword" />
            <small>{{ firstError(form.get('newPassword'), 'New password') }}</small>
          </label>

          <label class="form-field">
            Confirm Password
            <input type="password" formControlName="confirmPassword" />
            <small *ngIf="form.hasError('passwordMismatch') && form.get('confirmPassword')?.touched">Passwords must match.</small>
          </label>
        </div>

        <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Resetting...' : 'Reset Password' }}
        </button>
      </form>
    </div>
  </div>
</section>
