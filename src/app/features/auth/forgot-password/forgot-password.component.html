<section class="auth-section">
  <div class="container auth-shell">
    <div class="auth-panel">
      <div class="auth-panel__header">
        <span class="auth-eyebrow">Password Help</span>
        <h1>Forgot Password</h1>
        <p>Enter your email address to request reset instructions.</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-field">
          Email
          <input type="email" formControlName="email" />
          <small>{{ firstError(form.get('email'), 'Email') }}</small>
        </label>

        <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Sending...' : 'Send Reset Link' }}
        </button>

        <div class="auth-links">
          <a routerLink="/login">Back to login</a>
          <a routerLink="/reset-password">I have a reset token</a>
        </div>
      </form>
    </div>
  </div>
</section>
