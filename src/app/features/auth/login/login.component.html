<section class="auth-section">
  <div class="container auth-shell">
    <div class="auth-panel">
      <div class="auth-panel__header">
        <span class="auth-eyebrow">Account Access</span>
        <h1>Login</h1>
        <p>Sign in to manage your profile and protected QLSS pages.</p>
      </div>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <label class="form-field">
          Email
          <input type="email" formControlName="email" autocomplete="email" />
          <small>{{ firstError(form.get('email'), 'Email') }}</small>
        </label>

        <label class="form-field">
          Password
          <input type="password" formControlName="password" autocomplete="current-password" />
          <small>{{ firstError(form.get('password'), 'Password') }}</small>
        </label>

        <label class="check-row">
          <input type="checkbox" formControlName="rememberMe" />
          Remember me
        </label>

        <div *ngIf="errorMessage" class="form-error">{{ errorMessage }}</div>

        <button class="btn btn-primary auth-submit" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Signing in...' : 'Login' }}
        </button>

        <div class="auth-links">
          <a routerLink="/register">Create account</a>
          <a routerLink="/forgot-password">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>
</section>
