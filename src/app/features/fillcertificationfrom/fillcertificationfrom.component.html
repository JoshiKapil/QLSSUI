<section class="certification-form-page">
  <div class="container certification-form-shell">
    <div class="certification-form-header">
      <span class="auth-eyebrow">Assessment</span>
      <h1>Fill Exam Form</h1>
      <p>
        Enter your details to continue to the test. Existing details are loaded
        automatically for the same email and training.
      </p>
    </div>

    <form class="certification-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-grid">
        <label class="form-field training-search-field">
          Training
          <div class="training-search-control">
            <button
              class="btn btn-outline btn-small training-dropdown-toggle"
              type="button"
              (click)="toggleTrainingDropdown()"
              aria-haspopup="listbox"
              [attr.aria-expanded]="isTrainingDropdownOpen"
            >
              {{ getSelectedTrainingLabel() }}
              <span class="dropdown-icon">&#9662;</span>
            </button>
            <div
              class="training-search-menu"
              *ngIf="isTrainingDropdownOpen"
              role="listbox"
            >
              <input
                type="text"
                [(ngModel)]="trainingSearch"
                [ngModelOptions]="{ standalone: true }"
                placeholder="Search training"
                autocomplete="off"
                (input)="onTrainingSearchChange()"
              />
              <button
                class="training-search-option"
                type="button"
                *ngFor="let training of filteredTrainingList"
                (mousedown)="selectTrainingFromDropdown(training)"
                role="option"
              >
                {{ getTrainingLabel(training) }}
              </button>
              <div
                class="training-search-empty"
                *ngIf="!filteredTrainingList.length"
              >
                No training found
              </div>
            </div>
          </div>
          <small>{{ fieldError("trainingId", "Training") }}</small>
        </label>
        <label class="form-field"
          >Name
          <input type="text" formControlName="name" maxlength="200" />
          <small>{{ fieldError("name", "Name") }}</small>
        </label>

        <label class="form-field"
          >Mobile
          <input type="text" formControlName="mobile" maxlength="10" />
          <small>{{ fieldError("mobile", "Mobile") }}</small>
        </label>

        <label class="form-field"
          >Email
          <input type="email" formControlName="email" maxlength="200" />
          <button class="inline-link" type="button" (click)="findExistingRecord()">Load existing details</button>
          <small>{{ fieldError("email", "Email") }}</small>
        </label>

        <label class="form-field"
          >Trainer Name
          <select formControlName="trainerId">
            <option value="">
              {{ isLoadingTrainers ? "Loading trainers..." : "Select Trainer" }}
            </option>
            <option
              *ngFor="let trainer of trainers"
              [value]="trainer.trainerId"
            >
              {{ trainer.name }}
            </option>
          </select>
          <small>{{ fieldError("trainerId", "Trainer Name") }}</small>
        </label>

        <label class="form-field training-search-field">Company/Location
          <div class="training-search-control">
            <button class="btn btn-outline btn-small training-dropdown-toggle" type="button"
              (click)="toggleCompanyDropdown()" [attr.aria-expanded]="isCompanyDropdownOpen">
              {{ isLoadingCompanies ? "Loading companies..." : getSelectedCompanyLabel() }}
              <span class="dropdown-icon">&#9662;</span>
            </button>
            <div class="training-search-menu" *ngIf="isCompanyDropdownOpen">
              <input type="text" [(ngModel)]="companySearch" [ngModelOptions]="{ standalone: true }"
                placeholder="Search company/location" autocomplete="off" />
              <button class="training-search-option" type="button"
                *ngFor="let company of filteredCompanies" (mousedown)="selectCompany(company)">
                {{ company.clientName }}
              </button>
              <div class="training-search-empty" *ngIf="!filteredCompanies.length">No company found</div>
            </div>
          </div>
          <small>{{ fieldError("location", "Company/Location") }}</small>
        </label>


        <label class="form-field training-search-field">City (optional)
          <div class="training-search-control">
            <button class="btn btn-outline btn-small training-dropdown-toggle" type="button"
              (click)="toggleCityDropdown()" [disabled]="!selectedCompanyId || !selectedCompanyCities.length"
              [attr.aria-expanded]="isCityDropdownOpen">
              {{ selectedCompanyCities.length ? getSelectedCityLabel() : (selectedCompanyId ? "No cities configured" : "Select company first") }}
              <span class="dropdown-icon">&#9662;</span>
            </button>
            <div class="training-search-menu" *ngIf="isCityDropdownOpen">
              <input type="text" [(ngModel)]="citySearch" [ngModelOptions]="{ standalone: true }"
                placeholder="Search city" autocomplete="off" />
              <button class="training-search-option" type="button"
                *ngFor="let city of filteredCities" (mousedown)="selectCity(city)">
                {{ city.cityName }}
              </button>
              <div class="training-search-empty" *ngIf="!filteredCities.length">No city found</div>
            </div>
          </div>
          <small>{{ fieldError("cityId", "City") }}</small>
        </label>

        <label class="form-field"
          >Days
          <input type="number" formControlName="days" min="1" />
          <small>{{ fieldError("days", "Days") }}</small>
        </label>
        
        <label class="form-field"
          >Date
          <input type="date" formControlName="certificationDate" />
          <small>{{ fieldError("certificationDate", "Date") }}</small>
        </label>

      </div>

      <div class="form-actions">
        <button class="btn btn-primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? "Submitting..." : "Save & Continue to Test" }}
        </button>
        <button class="btn btn-outline" type="button" (click)="reset()">
          Reset
        </button>
      </div>
    </form>
  </div>
</section>
