<div class="zm-search-select" [class.is-open]="open">
  <button
    class="zm-search-select__toggle"
    type="button"
    (click)="toggleDropdown()"
    [disabled]="disabled"
    [attr.aria-expanded]="open"
  >
    <span class="zm-search-select__label" [class.placeholder]="!selectedOptions.length">
      {{ displayText }}
    </span>
    <span class="zm-search-select__actions">
      <span
        *ngIf="allowClear && selectedOptions.length"
        class="clear-selection"
        role="button"
        aria-label="Clear selection"
        (click)="clear($event)"
      >
        <i class="fas fa-times"></i>
      </span>
      <i class="fas fa-chevron-down toggle-icon" [class.rotated]="open"></i>
    </span>
  </button>

  <div class="zm-search-select__menu" *ngIf="open">
    <div class="zm-search-select__search">
      <i class="fas fa-search"></i>
      <input
        [(ngModel)]="search"
        placeholder="Type to search part no, description..."
        autocomplete="off"
        (click)="$event.stopPropagation()"
        autofocus
      />
      <button
        *ngIf="search"
        class="search-clear"
        type="button"
        (click)="search = ''; $event.stopPropagation()"
      >
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="zm-search-select__options">
      <button
        class="zm-search-select__option"
        type="button"
        *ngFor="let option of filteredOptions"
        (click)="select(option)"
        [class.selected]="selected(option)"
      >
        <i *ngIf="multiple" class="selection-box fas" [ngClass]="selected(option) ? 'fa-check-square' : 'fa-square'"></i>
        <div class="option-copy">
          <div class="option-top">
            <strong>{{ label(option) }}</strong>
            <span *ngIf="showStock && stock(option) !== null" class="stock-badge" [class.zero]="stock(option) === 0">
              Stock: {{ stock(option) }}
            </span>
          </div>
          <small *ngIf="detail(option)">{{ detail(option) }}</small>
        </div>
        <i *ngIf="!multiple && selected(option)" class="fas fa-check check-icon"></i>
      </button>

      <div class="no-options" *ngIf="!filteredOptions.length">
        <i class="fas fa-search"></i>
        <span>No matching items found</span>
      </div>
    </div>
  </div>
</div>
