<div class="contactModal" [class.active]="visible" (click)="onShellClick($event)">
  <div class="contactModal__overlay"></div>
  <div class="contactModal__box">
    <button type="button" class="contactModal__close" (click)="close()">&times;</button>
    <div class="contactModal__header">
      <div class="contactModal__icon"><i class="fa-solid fa-layer-group"></i></div>
      <h2>Need help with anything? Get in touch with us</h2>
    </div>
    <form class="contactModal__form" (ngSubmit)="sendToMe()" #contactForm="ngForm">
      <div class="contactModal__row">
        <div class="contactModal__field">
          <label>Name</label>
          <input type="text" name="name" placeholder="enter name" [(ngModel)]="name" required />
        </div>
        <div class="contactModal__field">
          <label>Phone</label>
          <input type="tel" name="mobile" placeholder="(91) 555 9999" [(ngModel)]="mobile" required />
        </div>
      </div>
      <div class="contactModal__field">
        <label>Email</label>
        <input type="email" name="email" placeholder="enter email" [(ngModel)]="email" required email />
      </div>
      <div class="contactModal__field">
        <label>What do you want to discuss?</label>
        <select name="messages" [(ngModel)]="messages">
          <option>Select</option>
          <option>Training</option>
          <option>Consulting</option>
          <option>Data Analytics</option>
          <option>Sustainability</option>
        </select>
      </div>
      <div class="contactModal__actions">
        <button type="button" class="btnCancel" (click)="close()">Cancel</button>
        <button type="submit" class="btnSubmit" [disabled]="isSending">
          {{ isSending ? 'Sending...' : 'Contact us' }}
        </button>
      </div>
    </form>
  </div>
</div>
