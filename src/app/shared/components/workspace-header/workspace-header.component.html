<header class="workspace-topbar">
  <button type="button" class="menu-toggle" (click)="menuToggle.emit()" aria-label="Toggle workspace navigation"><i class="fas fa-bars" aria-hidden="true"></i></button>
  <details class="workspace-switch"><summary>{{ title }} <i class="fas fa-chevron-down" aria-hidden="true"></i></summary><nav aria-label="Switch workspace"><a routerLink="/zeiss/dashboard">Zeiss Workspace</a><a routerLink="/workspace/dashboard">Project Workspace</a><a routerLink="/onboarding/my-learning">Employee Onboarding</a><a routerLink="/">QLSS website</a></nav></details>
  <span class="workspace-motto">Better processes. Brighter possibilities.</span>
  <div class="page-search"><i class="fas fa-search" aria-hidden="true"></i><input [(ngModel)]="query" (keydown.escape)="query = ''" placeholder="Find a workspace page?" aria-label="Find a workspace page" /><nav *ngIf="query.trim()" aria-label="Page search results"><a *ngFor="let page of pages" [routerLink]="page.path" (click)="query = ''">{{ page.label }} <i class="fas fa-arrow-right" aria-hidden="true"></i></a><span *ngIf="!pages.length">No matching pages</span></nav></div>
  <button type="button" class="theme-toggle" (click)="theme.toggleTheme()" [attr.aria-label]="'Switch to ' + (theme.isHeritage ? 'Classic' : 'Heritage') + ' theme'"><i class="fas" [ngClass]="theme.isHeritage ? 'fa-gem' : 'fa-shield-halved'" aria-hidden="true"></i><span>{{ theme.isHeritage ? 'Heritage' : 'Classic' }}</span></button>
  <a *ngIf="workspace !== 'onboarding'" class="notification-link" [routerLink]="'/' + workspace + '/notifications'" aria-label="Notifications"><i class="far fa-bell" aria-hidden="true"></i></a>
  <details class="account-menu"><summary><span class="account-avatar">{{ initials }}</span><span class="account-name">{{ name }}</span><i class="fas fa-chevron-down" aria-hidden="true"></i></summary><nav aria-label="Account"><a routerLink="/profile">My profile</a><a routerLink="/change-password">Change password</a><button type="button" (click)="auth.logout()">Sign out</button></nav></details>
</header>
